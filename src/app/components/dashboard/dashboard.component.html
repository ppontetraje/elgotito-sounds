<div class="main__container">
  <h1 class="sounds__tittle">EL GOTITO SOUNDS</h1>
  <div class="share__wp">
    <label>Compartir: </label>
    <a href="https://api.whatsapp.com/send?text=La página del gotito ppontetraje.github.io/elgotito-sounds/" data-action="share/whatsapp/share" target="_blank">
      <i class="fab fa-whatsapp"></i>
    </a>
  </div>
  

  <!-- 
  <div class="mobile__picture"> 
  </div> 
  -->

  <div class="container__divider">
  
    <div class="side__container"></div>
  
    <div class="pagination__container">
      <div class="button__container">
      <div class="sound__button" *ngFor="let item of soundList | paginate: { itemsPerPage: itemsPerPage, currentPage: p}">
        <a class="link__sound" (click)="playSound(item.soundURL)">
          <span class="text__button">{{ item.text }}</span>
         
        </a>
        <div class="tag__btn" *ngIf="item.tag=='New'; else elseBlock">
          <span class="new__text">{{item.tag}}</span>
          <span class="right__tag" (click)="toggleFavorite(item)">
            <i class="far fa-star" *ngIf="item.fav !== 'true'"></i>
            <i class="fas fa-star favorite-star" *ngIf="item.fav === 'true'"></i>
            <span class="tooltiptext">
              {{ item.fav === 'true' ? 'Quitar de favoritos' : 'Añadir a favoritos' }}
            </span>
          </span>
        </div>
        <ng-template #elseBlock>
          <div *ngIf="item.tag=='Hot'; else elseBlock2" class="tag__btn" >
            <span class="hot__text">{{ item.tag }}</span>
            <span class="right__tag" (click)="toggleFavorite(item)">
              <i class="far fa-star" *ngIf="item.fav !== 'true'"></i>
              <i class="fas fa-star favorite-star" *ngIf="item.fav === 'true'"></i>
              <span class="tooltiptext">
                {{ item.fav === 'true' ? 'Quitar de favoritos' : 'Añadir a favoritos' }}
              </span>
            </span>
          </div>
        </ng-template> 
        <ng-template #elseBlock2>
          <div class="tag__btn" >
            <span class="top__text">{{ item.tag }} </span>
            <span class="right__tag" (click)="toggleFavorite(item)">
              <i class="far fa-star" *ngIf="item.fav !== 'true'"></i>
              <i class="fas fa-star favorite-star" *ngIf="item.fav === 'true'"></i>
              <span class="tooltiptext">
                {{ item.fav === 'true' ? 'Quitar de favoritos' : 'Añadir a favoritos' }}
              </span>
            </span>
          </div>  
        </ng-template> 
      </div>     
    </div>
    <div class="pagination__ngx__container mt-8 py-5">
      <pagination-controls (pageChange)="p = $event" [maxSize]="3"></pagination-controls> 
    </div>
  </div>
   
    <div class="side__container"></div>
  </div>
  <div class="fb-comments gotito__fb" data-href="https://ppontetraje.github.io/elgotito-sounds/" data-mobile data-width="" data-numposts="10"></div>
  
</div>
