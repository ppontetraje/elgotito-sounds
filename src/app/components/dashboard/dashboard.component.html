<div class="main__container">
  <header class="hero__header">
    <div class="hero__portrait-frame">
      <img 
        src="./assets/images/el_gotito_pelao.png" 
        alt="Matthew - El Gotito" 
        class="hero__portrait" 
      />
    </div>
    <div class="hero__info">
      <span class="hero__badge">STREAMER & PRO PLAYER DOTA 2</span>
      <h1 class="sounds__tittle">EL GOTITO SOUNDS</h1>
      <div class="share__wp">
        <label>Compartir: </label>
        <a 
          href="https://api.whatsapp.com/send?text=La página del gotito ppontetraje.github.io/elgotito-sounds/" 
          data-action="share/whatsapp/share" 
          target="_blank"
          title="Compartir en WhatsApp"
        >
          <i class="fab fa-whatsapp"></i>
        </a>
      </div>
    </div>
  </header>

  <div class="container__divider">
    <div class="side__container"></div>

    <div class="pagination__container">
      <div class="button__container">
        <div 
          class="sound__button" 
          *ngFor="let item of soundList | paginate: { itemsPerPage: itemsPerPage, currentPage: p}"
          [class.is-playing]="(currentPlayingId$ | async) === item.id"
          (click)="playSound(item)"
        >
          <div class="tile__header">
            <span 
              *ngIf="item.tag" 
              class="tile__badge"
              [ngClass]="{
                'badge--new': item.tag === 'New',
                'badge--hot': item.tag === 'Hot',
                'badge--top': item.tag !== 'New' && item.tag !== 'Hot'
              }"
            >
              {{ item.tag }}
            </span>
            <span *ngIf="!item.tag" class="tile__badge--empty"></span>

            <span 
              class="right__tag favorite__btn" 
              (click)="toggleFavorite(item); $event.stopPropagation()"
            >
              <i class="far fa-star" *ngIf="item.fav !== 'true'"></i>
              <i class="fas fa-star favorite-star" *ngIf="item.fav === 'true'"></i>
              <span class="tooltiptext">
                {{ item.fav === 'true' ? 'Quitar de favoritos' : 'Añadir a favoritos' }}
              </span>
            </span>
          </div>

          <a class="link__sound">
            <span class="text__button">{{ item.text }}</span>
            <span class="playing__indicator" *ngIf="(currentPlayingId$ | async) === item.id">
              <i class="fas fa-volume-up"></i>
            </span>
          </a>
        </div>     
      </div>
      <div class="pagination__ngx__container mt-8 py-5">
        <pagination-controls (pageChange)="p = $event" [maxSize]="3"></pagination-controls> 
      </div>
    </div>

    <div class="side__container"></div>
  </div>
</div>
